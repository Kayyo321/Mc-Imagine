# Training configuration — NVIDIA / CUDA. This is the config the real runs use.
#
# The `model:` block is byte-for-byte identical to config.mps.yaml on purpose: the two files differ
# only in how the machine is driven (device, workers, AMP, batch size, epoch count), never in what
# is trained. A checkpoint produced here must be exportable and comparable against one produced on
# the Mac.
#
#   pip install -r model/requirements.txt          # then the CUDA torch wheel, see that file
#   python -m mc_imagine_model.scripts.bootstrap
#   python -m mc_imagine_model.scripts.generate_data --regions 8000 --out model/data
#   python -m mc_imagine_model.training.train \
#     --config model/src/mc_imagine_model/training/config.cuda.yaml
#
# Interrupted? Resume without losing the run:
#   ... --config .../config.cuda.yaml --resume model/training_runs/cuda_run3/last.pt

model:
  checkpoint_dir: null  # null -> PromptEncoder uses its own absolute default (model/checkpoints/all-MiniLM-L6-v2), independent of cwd
  halo: 9
  patch: 16
  conv_channels: 192
  num_conv_layers: 6
  num_conv3d_layers: 3
  fusion_hidden: 512
  fusion_out: 256
  seed_freqs: 32
  seed_embed_dim: 64
  num_profiles: 8
  num_biomes: 12  # Phase 2 palette: +badlands/eroded_badlands/stony_peaks/beach (spec_constants.NUM_BIOMES)

training:
  batch_size: 256
  learning_rate: 0.0006  # scaled with the 4x larger batch vs. config.mps.yaml
  weight_decay: 0.01
  num_epochs: 60
  warmup_steps: 500
  grad_clip_norm: 1.0
  terrain_weight: 1.0
  biome_weight: 1.0
  slope_weight: 1.0  # weight of TerrainLoss's finite-difference slope term (Phase 2 slope-aware loss)
  # Weight of ReliefLoss — matches the AMOUNT of within-chunk relief rather than its pointwise
  # value. Without it, flat terrain is the MSE optimum whenever the per-cell slope is unpredictable
  # (see losses.ReliefLoss). Measured at this weight: relief holds ~21% of target across training
  # instead of peaking at 19% by step 750 and collapsing to 6%.
  relief_weight: 10.0
  # Phase 4 Gate 2 starting point. Sweep these before the full run; do not leave them at zero or
  # the occupancy head trains only through incidental export-time plumbing.
  occupancy_weight: 1.0
  # Overhang loss weight. RETUNED for docs/phase4.2-plan.md §3.2/§3.3: OverhangLoss changed from
  # an unnormalized per-chunk-count MSE (where the old [0.003, 0.01] range and the Phase 4.1
  # instability it was calibrated against both lived) to a per-cell BCE, which is a different scale
  # entirely and makes the old range meaningless. Swept from 1.0 (docs/phase4.2-plan.md §3.3's
  # starting point) via loss_mass.py: at 4.0 the overhang term is 24.15% of total loss at a
  # heightfield-only prediction (target band [15%, 40%] -- present, not dominant).
  overhang_weight: 4.0
  # Zeroed, not redesigned: ConsistencyLoss's residual is minimized by pushing soft_topmost toward
  # the top of the band regardless of data (docs/remote-training-readiness-plan.md §2.H1). A live
  # candidate contributor to Gate 2's uniform 0.0000% result. Decision is locked at 0.0 (§5 item 0.2);
  # a corrected loss is a separate research change, not part of this fix.
  consistency_weight: 0.0
  checkpoint_dir: "training_runs/cuda_run3"  # relative paths resolve against model/ (see train.resolve_path)
  resume: null  # path to a .pt to resume from; --resume on the CLI overrides this
  log_every: 50
  val_every_epochs: 1
  # docs/remote-training-readiness-plan.md §2.C1: 60 epochs x 123 MB is 7.6 GB against a
  # 20-50 GB rented disk with the dataset/wheels already eating most of it. Keep the last 3
  # epoch_NNN.pt files plus best.pt/last.pt (which are always overwritten in place, not rotated).
  keep_last_n_checkpoints: 3
  # docs/remote-training-readiness-plan.md §2.G1: writes last.pt only (no validation pass) every
  # save_every_steps — bounds the data-loss window on spot/interruptible instances, which can be
  # reclaimed with ~30s notice. 0 disables. Paired with a SIGTERM/SIGINT handler that does the same.
  save_every_steps: 500
  qualitative_dump_every_epochs: 5  # the PNG dump runs 6 prompts x 8x8 chunks on-device; less often on long runs
  target_range_check_batches: 8  # startup assert: all height/water targets inside the head's band
  seed: 1234  # identical to config.mps.yaml — seeding is device-independent so curves are comparable

data:
  data_dir: "data"
  chunks_per_region: 100
  max_prompt_length: 128
  augmentation: false  # see data/labeler.py's maybe_paraphrase — documented no-op, no LLM API available
  val_region_fraction: 0.08
  # With num_workers > 0 each worker holds its own shard cache, so the whole-split default would be
  # multiplied by 8. At 512 this was 9.69 GB/process x 16 processes = 155 GB — the OOM that killed
  # the 2026-08 run (docs/remote-training-readiness-plan.md §1, §2.A1). The LRU only delivers a ~7%
  # hit rate at 8000-region scale anyway, so 8 costs little throughput for a ~150x smaller budget.
  shard_cache_size: 8

hardware:
  device: "cuda"
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  # fp16 autocast + GradScaler; CUDA-only, a no-op on any other device.
  #
  # DISABLED after the 2026-07-28 8000-region run died of fp16 overflow: GradScaler's scale
  # collapsed 2048 -> 0.1 -> 0.0, every optimizer step was skipped from epoch 12 on (consecutive
  # checkpoints byte-identical), and by epoch 16 26/127 weight tensors were NaN. Nothing crashed
  # and the log kept printing normal-looking progress the whole time, so it burned 9 hours of GPU
  # producing nothing. train.py's AMP loop is correct (scale -> backward -> unscale_ -> clip ->
  # step -> update), so this is fp16 numerics, not a code bug.
  #
  # The cost of fp32 here is close to zero: this workload is dataloader-bound, not GPU-bound (GPU
  # sat at 30-60% while all CPU threads were pinned decompressing .npz shards), so fp16 was buying
  # throughput on a resource that was already idle. Measured 9.15 h for 60 epochs in fp32.
  #
  # config.mps.yaml already sets this false (AMP is CUDA-only by policy), so this file is the only
  # place it mattered.
  mixed_precision: false
