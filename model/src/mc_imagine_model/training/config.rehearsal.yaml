# Training configuration — Fast Rehearsal / Smoke Test (`num_epochs: 1`).
#
# Paired with `--regions 400 --max-steps 50` for rapid end-to-end pipeline checking.
#
#   pip install -r model/requirements.txt
#   python -m mc_imagine_model.scripts.bootstrap
#   python -m mc_imagine_model.scripts.generate_data --regions 400 --out model/data
#   python -m mc_imagine_model.training.train \
#     --config model/src/mc_imagine_model/training/config.rehearsal.yaml --max-steps 50
#
# Interrupted? Resume without losing the run:
#   ... --config .../config.rehearsal.yaml --resume model/training_runs/rehearsal/last.pt

model:
  checkpoint_dir: null  # null -> PromptEncoder uses its own absolute default (model/checkpoints/all-MiniLM-L6-v2), independent of cwd
  halo: 9
  patch: 16
  conv_channels: 192
  num_conv_layers: 6
  num_conv3d_layers: 3
  fusion_hidden: 512
  fusion_out: 256
  seed_freqs: 32
  seed_embed_dim: 64
  num_profiles: 8
  num_biomes: 12  # Phase 2 palette: +badlands/eroded_badlands/stony_peaks/beach (spec_constants.NUM_BIOMES)

training:
  batch_size: 256
  learning_rate: 0.0006  # scaled with the 4x larger batch vs. config.mps.yaml
  weight_decay: 0.01
  num_epochs: 1
  warmup_steps: 500
  grad_clip_norm: 1.0
  terrain_weight: 1.0
  biome_weight: 1.0
  slope_weight: 1.0  # weight of TerrainLoss's finite-difference slope term (Phase 2 slope-aware loss)
  relief_weight: 10.0
  # Phase 4 Gate 2 starting point; sweep before a full release run.
  occupancy_weight: 1.0
  # Overhang loss weight. Lowered from 1.0 to 0.005 per Phase 4.1 recovery plan.
  # High overhang weights (e.g. 1.0 or 0.05) caused severe loss instability and gradient clipping
  # domination at Gate 2 (overhang loss spiked to ~243.0 at step 0). Empirical optimal range is [0.003, 0.01].
  overhang_weight: 0.005
  consistency_weight: 0.25
  checkpoint_dir: "training_runs/rehearsal"  # relative paths resolve against model/ (see train.resolve_path)
  resume: null  # path to a .pt to resume from; --resume on the CLI overrides this
  log_every: 50
  val_every_epochs: 1
  qualitative_dump_every_epochs: 1  # the PNG dump runs 6 prompts x 8x8 chunks on-device; less often on long runs
  target_range_check_batches: 8  # startup assert: all height/water targets inside the head's band
  seed: 1234  # identical to config.mps.yaml — seeding is device-independent so curves are comparable

data:
  data_dir: "data"
  chunks_per_region: 100
  max_prompt_length: 128
  augmentation: false  # see data/labeler.py's maybe_paraphrase — documented no-op, no LLM API available
  val_region_fraction: 0.08
  # With num_workers > 0 each worker holds its own shard cache, so the whole-split default would be
  # multiplied by 8. Cap it; misses just re-read an .npz.
  shard_cache_size: 512

hardware:
  device: "cuda"
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  mixed_precision: false

