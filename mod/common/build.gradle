architectury {
    common(rootProject.enabled_platforms.split(","))
}

dependencies {
    modImplementation "dev.architectury:architectury:${rootProject.architectury_version}"
    implementation "com.microsoft.onnxruntime:onnxruntime:1.19.2"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
    testImplementation "org.mockito:mockito-core:5.5.0"
}

test {
    useJUnitPlatform()
    // ModelLoader.discoverModels() scans the whole mcimagine/models directory and runs a trial
    // inference against every .mcim it finds (see docs/model-spec.md's manifest min_ram_mb) — once
    // a real-sized trained model (~86MB, min_ram_mb: 2048) sits alongside the tiny dummy fixture,
    // the JVM's 512m default test heap is no longer enough (this OOM'd before this was added).
    maxHeapSize = "2g"
}